name: Go
on: [push, pull_request]

env:
  GO_VERSION: 1.27.x

jobs:
  # Default Cgo backend on every OS. Linux needs X11 headers and runs under
  # xvfb so the display-backed tests get a session; macOS/Windows runners
  # lack Accessibility rights, so input tests skip via requireDisplay.
  cgo:
    name: cgo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6

      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libx11-dev xorg-dev libxtst-dev xvfb xsel xclip

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet .

      - name: Smoke test
        if: runner.os != 'Linux'
        run: go test -v robot_info_test.go

      - name: Test
        if: runner.os != 'Linux'
        run: go test -v .

      - name: Test (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run go test -v ./...

  # Pure-Go backends on their native OS: root package with the backend tag
  # plus the backend package itself, and the `purego` shortcut tag.
  purego:
    name: purego (${{ matrix.os }}, ${{ matrix.tags }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tags: mac
            pkgs: ./darwin
          - os: macos-latest
            tags: purego
            pkgs: ./darwin
          - os: windows-latest
            tags: win
            pkgs: ./win
          - os: windows-latest
            tags: purego
            pkgs: ./win
          - os: ubuntu-latest
            tags: x11
            pkgs: ./x11
          - os: ubuntu-latest
            tags: purego,x11
            pkgs: ./x11
          - os: ubuntu-latest
            tags: wayland
            pkgs: ./wayland
          - os: ubuntu-latest
            tags: purego
            pkgs: ./wayland
          - os: ubuntu-latest
            tags: libei
            pkgs: ./libei
          - os: ubuntu-latest
            tags: purego,libei
            pkgs: ./libei
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Vet
        run: go vet -tags "${{ matrix.tags }}" . ${{ matrix.pkgs }}

      - name: Test
        run: go test -v -tags "${{ matrix.tags }}" . ${{ matrix.pkgs }}

  # Every pure-Go backend must cross-compile with CGO_ENABLED=0 from one host.
  cross:
    name: cross (${{ matrix.goos }}/${{ matrix.goarch }}, ${{ matrix.tags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64, tags: mac }
          - { goos: darwin, goarch: arm64, tags: mac }
          - { goos: windows, goarch: amd64, tags: win }
          - { goos: windows, goarch: arm64, tags: win }
          - { goos: windows, goarch: "386", tags: win }
          - { goos: linux, goarch: amd64, tags: x11 }
          - { goos: linux, goarch: arm64, tags: x11 }
          - { goos: linux, goarch: amd64, tags: wayland }
          - { goos: linux, goarch: arm64, tags: wayland }
          - { goos: linux, goarch: amd64, tags: libei }
          - { goos: linux, goarch: arm64, tags: libei }
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Build
        run: go build -v -tags "${{ matrix.tags }}" .

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi
