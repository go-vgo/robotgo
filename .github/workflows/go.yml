name: Go
# One run per change: pushes to master and pull requests (a push to a PR
# branch no longer triggers a second run); a newer run cancels the older one.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs only build and test; the token never needs to write.
permissions:
  contents: read

env:
  GO_VERSION: 1.27.x

jobs:
  # Default Cgo backend on every OS. Linux needs X11 headers and runs under
  # xvfb so the display-backed tests get a session; macOS/Windows runners
  # lack Accessibility rights, so input tests skip via requireDisplay.
  cgo:
    name: cgo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libx11-dev xorg-dev libxtst-dev xvfb xsel xclip

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet .

      - name: Test
        if: runner.os != 'Linux'
        run: go test -v .

      - name: Test (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run go test -v ./...

  # Pure-Go backends (CGO_ENABLED=0) vetted and tested on their native OS:
  # the backend packages, then the root package once per backend tag and
  # once with the `purego` shortcut. One job per OS loops over its tags.
  purego:
    name: purego (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkgs: ./darwin
            tags: mac purego
          - os: windows-latest
            pkgs: ./win
            tags: win purego
          - os: ubuntu-latest
            pkgs: ./x11 ./wayland ./libei
            tags: x11 purego,x11 wayland purego libei purego,libei
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Vet and test
        shell: bash
        run: |
          go vet ${{ matrix.pkgs }}
          go test ${{ matrix.pkgs }}
          for tags in ${{ matrix.tags }}; do
            echo "::group::-tags $tags"
            go vet -tags "$tags" .
            go test -tags "$tags" .
            echo "::endgroup::"
          done

  # The purego job already compiles each backend for its native GOOS/GOARCH;
  # this builds the remaining GOOS/GOARCH pairs from one host (CGO_ENABLED=0,
  # build only, no tests).
  cross:
    name: cross
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build
        run: |
          for target in \
            darwin/amd64/mac darwin/arm64/mac \
            windows/arm64/win windows/386/win \
            linux/arm64/x11 linux/arm64/wayland linux/arm64/libei; do
            IFS=/ read -r goos goarch tags <<< "$target"
            echo "$goos/$goarch -tags $tags"
            GOOS=$goos GOARCH=$goarch go build -tags "$tags" .
          done
